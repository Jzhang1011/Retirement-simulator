<!DOCTYPE html>
<html lang="en">
<head>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-9JMJJ5CJR4"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-9JMJJ5CJR4');
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }}</title>
  
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --royal: #2563eb;
      --emerald: #02B17D;
      --navy: #0B132B;
    }
    
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, sans-serif;
      background: #ffffff;
      color: #0F172A;
    }

    /* LAYOUT BOUNDS GRID */
    .article-container {
      max-width: 1140px;
      margin: 0 auto;
      padding: 3rem 1.5rem;
      display: grid;
      grid-template-columns: 1fr;
      gap: 3.5rem;
    }

    @media (min-width: 960px) {
      .article-container { grid-template-columns: 2.2fr 1fr; }
    }

    /* TYPOGRAPHY MATRIX */
    .story-content p {
      font-size: 1.15rem;
      line-height: 1.85;
      color: #334155;
      margin-bottom: 1.75rem;
    }

    .story-content h2 {
      font-size: 1.8rem;
      font-weight: 900;
      letter-spacing: -0.03em;
      color: #0f172a;
      margin-top: 3rem;
      margin-bottom: 1.25rem;
    }

    .story-content h3 {
      font-size: 1.4rem;
      font-weight: 800;
      color: #0f172a;
      margin-top: 2rem;
      margin-bottom: 0.75rem;
    }
    
    .story-content ul {
      margin-bottom: 2rem;
      padding-left: 1.5rem;
    }

    .story-content li {
      font-size: 1.15rem;
      line-height: 1.7;
      color: #334155;
      margin-bottom: 0.5rem;
      list-style-type: disc;
    }

    /* MULTI-MODAL STICKY TOGGLE */
    .sticky-toggle {
      position: sticky;
      top: 0;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: 1rem 0;
      z-index: 50;
      display: flex;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .toggle-btn {
      padding: 0.5rem 1rem;
      border-radius: 99px;
      font-size: 0.875rem;
      font-weight: 700;
      border: 1px solid var(--border);
      background: white;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    .toggle-btn.active {
      background: var(--royal);
      color: white;
      border-color: var(--royal);
    }

    /* MEDIA CONTAINERS */
    .media-container {
      display: none; 
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 2rem;
    }
    
    .media-container.active {
      display: block;
    }

    .video-wrapper {
      aspect-ratio: 16/9;
      width: 100%;
      background: #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }

    .audio-wrapper {
      width: 100%;
      padding: 2rem;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    /* INTERACTIVE FLASHCARD */
    .flashcard-container {
      perspective: 1000px;
      width: 100%;
      max-width: 500px;
      margin: 2rem auto;
      height: 200px;
    }

    .flashcard {
      width: 100%;
      height: 100%;
      position: relative;
      transition: transform 0.6s;
      transform-style: preserve-3d;
      cursor: pointer;
    }

    .flashcard.is-flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      border-radius: 12px;
      border: 2px solid var(--border);
      background: white;
      text-align: center;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .card-back {
      transform: rotateY(180deg);
      background: #eff6ff;
      border-color: var(--royal);
    }

    /* Strategy section */
    .strategy-reveal {
      background: #F8FAFC;
      border-left: 6px solid #2563eb;
      border-radius: 12px;
      padding: 28px;
      margin: 40px 0;
    }

    .strategy-reveal h3 {
      margin-top: 0;
      font-size: 24px;
      font-weight: 800;
      color: #0F172A;
      margin-bottom: 1rem;
    }
  </style>

  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>

 <div id="global-header-target"></div>

  <!-- STICKY MEDIA TOGGLE -->
  <div class="sticky-toggle justify-center shadow-sm">
    <button class="toggle-btn active" id="btn-read">📖 Read Article</button>
    <button class="toggle-btn" id="btn-watch">📺 Watch Summary</button>
    <button class="toggle-btn" id="btn-listen">🎧 Listen to Deep Dive</button>
  </div>

  <!-- MAIN CONTAINER BLOCKS -->
  <div class="article-container">
    {{ content }}
  </div>

  <script>
    // Global Multi-modal toggle states for all posts
    document.getElementById('btn-read').addEventListener('click', function() {
      this.classList.add('active');
      document.getElementById('btn-watch').classList.remove('active');
      document.getElementById('btn-listen').classList.remove('active');
      
      const vid = document.getElementById('video-container');
      const aud = document.getElementById('audio-container');
      if(vid) vid.classList.remove('active');
      if(aud) aud.classList.remove('active');
    });
 
    document.getElementById('btn-watch').addEventListener('click', function() {
      this.classList.add('active');
      document.getElementById('btn-read').classList.remove('active');
      document.getElementById('btn-listen').classList.remove('active');
      
      const vid = document.getElementById('video-container');
      const aud = document.getElementById('audio-container');
      if(vid) vid.classList.add('active');
      if(aud) aud.classList.remove('active');
    });
 
    document.getElementById('btn-listen').addEventListener('click', function() {
      this.classList.add('active');
      document.getElementById('btn-read').classList.remove('active');
      document.getElementById('btn-watch').classList.remove('active');
      
      const vid = document.getElementById('video-container');
      const aud = document.getElementById('audio-container');
      if(aud) aud.classList.add('active');
      if(vid) vid.classList.remove('active');
    });
  </script>
  <script src="/components/header.js"></script> 
</body>
</html>
